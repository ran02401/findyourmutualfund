      function App() {
        const [currentView, setCurrentView] = useState('home');
        const [selectedFundId, setSelectedFundId] = useState(null);
        const [activeHoverData, setActiveHoverData] = useState(null);
        const [graphTimeframe, setGraphTimeframe] = useState('ALL');

        const [compareList, setCompareList] = useState(['in-1', 'in-2']);
        const [displayCount, setDisplayCount] = useState(5);

        const [searchQuery, setSearchQuery] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [selectedRiskFilter, setSelectedRiskFilter] = useState('All');
        const [sortBy, setSortBy] = useState('cagr5');

        const [fundDatabase, setFundDatabase] = useState(INITIAL_FUND_DATABASE);
        const [isSyncing, setIsSyncing] = useState(false);
        const [lastSyncTime, setLastSyncTime] = useState('Live Now');

        const handleTriggerLiveSync = () => {
          setIsSyncing(true);
          setTimeout(() => {
            setFundDatabase(prev => prev.map(fund => {
              const randomDelta = (Math.random() * 0.4 - 0.15);
              const newNav = Number((fund.nav + randomDelta).toFixed(2));
              return {
                ...fund,
                nav: newNav,
                cagr5: Number((fund.cagr5 + (randomDelta * 0.05)).toFixed(1)),
                lastUpdated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
              };
            }));
            setLastSyncTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            setIsSyncing(false);
          }, 800);
        };

        const [questStep, setQuestStep] = useState(1);
        const [userAnswers, setUserAnswers] = useState({
          q1DipReaction: '', 
          q2RiskComfort: '',  
          q3Priority: '',     
          monthlyAmount: 10000,
          expectedReturn: 14,
          horizon: 'medium'   
        });

        const calculatedRiskProfile = useMemo(() => {
          let score = 0;
          if (userAnswers.q1DipReaction === 'sell') score += 1;
          if (userAnswers.q1DipReaction === 'wait') score += 2;
          if (userAnswers.q1DipReaction === 'buyMore') score += 3;

          if (userAnswers.q2RiskComfort === 'low') score += 1;
          if (userAnswers.q2RiskComfort === 'moderate') score += 2;
          if (userAnswers.q2RiskComfort === 'high') score += 3;

          if (userAnswers.q3Priority === 'protect') score += 1;
          if (userAnswers.q3Priority === 'stable') score += 2;
          if (userAnswers.q3Priority === 'maxGrowth') score += 3;

          if (score <= 4) return 'Conservative';
          if (score <= 7) return 'Moderate';
          return 'Aggressive';
        }, [userAnswers]);

        const recommendedFunds = useMemo(() => {
          const userRisk = calculatedRiskProfile;
          const targetReturn = Number(userAnswers.expectedReturn);
          const horizon = userAnswers.horizon;

          return fundDatabase.map(fund => {
            let score = 70;
            if (userRisk === 'Conservative') {
              if (fund.riskLevel === 'Low') score += 25;
              else if (fund.riskLevel === 'Moderate') score += 10;
              else score -= 20;
            } else if (userRisk === 'Moderate') {
              if (fund.riskLevel === 'Moderate') score += 25;
              else if (fund.riskLevel === 'Low') score += 15;
              else score += 10;
            } else if (userRisk === 'Aggressive') {
              if (fund.riskLevel === 'High') score += 25;
              else if (fund.riskLevel === 'Moderate') score += 15;
              else score -= 10;
            }

            if (horizon === 'short') {
              if (fund.riskLevel === 'Low' || fund.debtAlloc > 50) score += 15;
              else score -= 15;
            } else if (horizon === 'long') {
              if (fund.equityAlloc > 60) score += 15;
            }

            const diff = Math.abs(fund.cagr5 - targetReturn);
            if (diff <= 2) score += 10;
            else if (diff <= 5) score += 5;

            if (fund.expenseRatio < 0.7) score += 5;

            const finalMatch = Math.min(Math.max(score, 65), 98);

        );

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
